<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" width="620" height="340" role="img"
     aria-label="Sample timed-entry ticket for five people, Tuesday 27 October, 09:30. Not a real ticket.">
  <title>Sample entry ticket — not a real ticket</title>
  <defs>
    <pattern id="sample2" width="220" height="220" patternUnits="userSpaceOnUse" patternTransform="rotate(-24)">
      <text x="0" y="40" font-family="Inter, Arial, Helvetica, sans-serif" font-size="26" font-weight="700"
            letter-spacing="6" fill="#15324b" fill-opacity="0.07">SAMPLE</text>
    </pattern>
  </defs>

  <rect width="620" height="340" rx="14" fill="#ffffff" stroke="#d8cbb0"/>
  <rect x="1" y="1" width="618" height="338" rx="13" fill="url(#sample2)"/>

  <rect x="1" y="1" width="618" height="34" rx="13" fill="#15324b"/>
  <rect x="1" y="22" width="618" height="13" fill="#15324b"/>
  <text x="24" y="24" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700"
        letter-spacing="2.4" fill="#f3ead9">SAMPLE DOCUMENT — NOT A VALID TICKET</text>

  <text x="24" y="76" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11" font-weight="700"
        letter-spacing="2.6" fill="#8a6f3c">TIMED ENTRY</text>
  <text x="24" y="108" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="700" fill="#15324b">Colosseum &amp; Roman Forum</text>

  <line x1="24" y1="128" x2="596" y2="128" stroke="#e2d7bf"/>

  <text x="24" y="164" font-family="Inter, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.8" fill="#8a6f3c">DATE</text>
  <text x="24" y="190" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#15324b">Tue 27 October 2026</text>

  <text x="24" y="228" font-family="Inter, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.8" fill="#8a6f3c">ENTRY TIME</text>
  <text x="24" y="254" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#15324b">09:30 — arrive by 09:15</text>

  <text x="330" y="164" font-family="Inter, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.8" fill="#8a6f3c">ADMITS</text>
  <text x="330" y="190" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#15324b">5 people</text>

  <text x="330" y="228" font-family="Inter, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.8" fill="#8a6f3c">MEETING POINT</text>
  <text x="330" y="254" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#15324b">Guide at the gate</text>

  <!-- A block that reads as a scannable code without pretending to encode one. -->
  <g fill="#15324b">
    <rect x="452" y="60" width="6" height="52"/><rect x="462" y="60" width="3" height="52"/>
    <rect x="470" y="60" width="8" height="52"/><rect x="483" y="60" width="3" height="52"/>
    <rect x="491" y="60" width="5" height="52"/><rect x="501" y="60" width="9" height="52"/>
    <rect x="515" y="60" width="3" height="52"/><rect x="523" y="60" width="6" height="52"/>
    <rect x="534" y="60" width="4" height="52"/><rect x="543" y="60" width="8" height="52"/>
    <rect x="556" y="60" width="3" height="52"/><rect x="564" y="60" width="6" height="52"/>
    <rect x="575" y="60" width="4" height="52"/><rect x="584" y="60" width="7" height="52"/>
  </g>
  <text x="452" y="126" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#78716c">SAMPLE-0000-0000</text>

  <text x="24" y="308" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11" fill="#78716c">
    An illustration of what a client opens from their travel wallet. This ticket admits nobody.
  </text>
</svg>
