<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" width="620" height="320" role="img"
     aria-label="Sample hotel confirmation, 26 October to 1 November, two rooms. Not a real confirmation.">
  <title>Sample hotel confirmation — not a real booking</title>
  <defs>
    <pattern id="sample3" width="220" height="220" patternUnits="userSpaceOnUse" patternTransform="rotate(-24)">
      <text x="0" y="40" font-family="Inter, Arial, Helvetica, sans-serif" font-size="26" font-weight="700"
            letter-spacing="6" fill="#193F46" fill-opacity="0.07">SAMPLE</text>
    </pattern>
  </defs>

  <rect width="620" height="320" rx="14" fill="#ffffff" stroke="#C7BFB1"/>
  <rect x="1" y="1" width="618" height="318" rx="13" fill="url(#sample3)"/>

  <rect x="1" y="1" width="618" height="34" rx="13" fill="#193F46"/>
  <rect x="1" y="22" width="618" height="13" fill="#193F46"/>
  <text x="24" y="24" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700"
        letter-spacing="2.4" fill="#FAF8F3">SAMPLE DOCUMENT — NOT A REAL BOOKING</text>

  <text x="24" y="76" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11" font-weight="700"
        letter-spacing="2.6" fill="#C6A15B">CONFIRMATION</text>
  <text x="24" y="108" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="700" fill="#193F46">A hotel inside the Ghetto</text>

  <line x1="24" y1="128" x2="596" y2="128" stroke="#C7BFB1"/>

  <text x="24" y="164" font-family="Inter, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.8" fill="#C6A15B">GUEST</text>
  <text x="24" y="190" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#193F46">Cohen — party of five</text>

  <text x="24" y="228" font-family="Inter, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.8" fill="#C6A15B">NIGHTS</text>
  <text x="24" y="254" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#193F46">26 Oct – 1 Nov · 6 nights</text>

  <text x="340" y="164" font-family="Inter, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.8" fill="#C6A15B">ROOMS</text>
  <text x="340" y="190" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#193F46">2 · adjoining</text>

  <text x="340" y="228" font-family="Inter, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.8" fill="#C6A15B">REFERENCE</text>
  <text x="340" y="254" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#193F46">SAMPLE-0000</text>

  <text x="24" y="292" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11" fill="#78716c">
    An illustration of what a client opens from their travel wallet. No room is held against this.
  </text>
</svg>
