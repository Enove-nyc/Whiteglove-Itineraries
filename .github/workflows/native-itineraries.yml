name: Build Itineraries native app

# Native Capacitor shell for the White Glove Itineraries app. Builds a debug APK
# always, and a SIGNED release .aab for the Play Store when the upload-key
# secrets are set (WG_ITIN_KEYSTORE_BASE64 / WG_ITIN_KEYSTORE_PASSWORD /
# WG_ITIN_KEY_ALIAS / WG_ITIN_KEY_PASSWORD).

on:
  workflow_dispatch:
  push:
    branches: [claude/native-apps]
    paths:
      - "native/itineraries/**"
      - ".github/workflows/native-itineraries.yml"
      - "scripts/verify-native-release.mjs"
      - "scripts/native-release-metadata.mjs"
      - "scripts/native-release-metadata.test.mjs"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WG_ITIN_KEYSTORE_BASE64: ${{ secrets.WG_ITIN_KEYSTORE_BASE64 }}
      WG_ITIN_KEYSTORE_PASSWORD: ${{ secrets.WG_ITIN_KEYSTORE_PASSWORD }}
      WG_ITIN_KEY_ALIAS: ${{ secrets.WG_ITIN_KEY_ALIAS }}
      WG_ITIN_KEY_PASSWORD: ${{ secrets.WG_ITIN_KEY_PASSWORD }}
    defaults:
      run:
        working-directory: native/itineraries
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Check release metadata parser
        run: node --test ../../scripts/native-release-metadata.test.mjs
      - name: Install Capacitor
        run: npm ci --no-audit --no-fund
      - name: Sync web config + plugins into the committed Android project
        run: npx cap sync android
      - name: Build debug APK
        working-directory: native/itineraries/android
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace
      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: itineraries-debug-apk
          path: native/itineraries/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Decode the upload keystore
        if: env.WG_ITIN_KEYSTORE_BASE64 != ''
        run: echo "$WG_ITIN_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/wg-itin-upload.keystore"
      - name: Build signed release AAB
        if: env.WG_ITIN_KEYSTORE_BASE64 != ''
        working-directory: native/itineraries/android
        env:
          WG_ITIN_KEYSTORE_PATH: ${{ runner.temp }}/wg-itin-upload.keystore
        run: ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace
      - name: Upload the signed AAB (for the Play Store)
        if: env.WG_ITIN_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: itineraries-release-aab
          path: native/itineraries/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload signed release APK
        if: env.WG_ITIN_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: itineraries-release-apk
          path: native/itineraries/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Verify package, SDK, version and original signing certificate
        if: env.WG_ITIN_KEYSTORE_BASE64 != ''
        env:
          EXPECTED_UPLOAD_CERT_SHA256: 3af98de9a3da39f9ff3a34f1debf00b330ad2edc19e65003ff7012c8ed8f680a
        run: node ../../scripts/verify-native-release.mjs
      - name: Upload public release verification
        if: env.WG_ITIN_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: itineraries-release-verification
          path: native/itineraries/release-verification.json
          if-no-files-found: error
