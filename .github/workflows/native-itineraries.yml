name: Build Itineraries native app

# Native Capacitor shell for the White Glove Itineraries app. Builds a debug APK
# always, and a SIGNED release .aab for the Play Store when the upload-key
# secrets are set (WG_ITIN_KEYSTORE_BASE64 / WG_ITIN_KEYSTORE_PASSWORD /
# WG_ITIN_KEY_ALIAS / WG_ITIN_KEY_PASSWORD).

on:
  workflow_dispatch:
  push:
    branches: [claude/native-apps, codex/family-trip-play-store]
    paths:
      - "native/itineraries/**"
      - ".github/workflows/native-itineraries.yml"
      - "scripts/verify-native-release.mjs"
      - "scripts/native-release-metadata.mjs"
      - "scripts/native-release-metadata.test.mjs"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WG_ITIN_KEYSTORE_BASE64: ${{ secrets.WG_ITIN_KEYSTORE_BASE64 }}
      WG_ITIN_KEYSTORE_PASSWORD: ${{ secrets.WG_ITIN_KEYSTORE_PASSWORD }}
      WG_ITIN_KEY_ALIAS: ${{ secrets.WG_ITIN_KEY_ALIAS }}
      WG_ITIN_KEY_PASSWORD: ${{ secrets.WG_ITIN_KEY_PASSWORD }}
    defaults:
      run:
        working-directory: native/itineraries
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Check release metadata parser
        run: node --test ../../scripts/native-release-metadata.test.mjs
      - name: Install Capacitor
        run: npm ci --no-audit --no-fund
      - name: Sync web config + plugins into the committed Android project
        run: npx cap sync android
      - name: Build debug APK
        working-directory: native/itineraries/android
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace
      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: itineraries-debug-apk
          path: native/itineraries/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Decode the upload keystore
        if: env.WG_ITIN_KEYSTORE_BASE64 != ''
        run: echo "$WG_ITIN_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/wg-itin-upload.keystore"
      - name: Build signed release AAB
        if: env.WG_ITIN_KEYSTORE_BASE64 != ''
        working-directory: native/itineraries/android
        env:
          WG_ITIN_KEYSTORE_PATH: ${{ runner.temp }}/wg-itin-upload.keystore
        run: ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace
      - name: Upload the signed AAB (for the Play Store)
        if: env.WG_ITIN_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: itineraries-release-aab
          path: native/itineraries/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload signed release APK
        if: env.WG_ITIN_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: itineraries-release-apk
          path: native/itineraries/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Verify package, SDK, version and original signing certificate
        if: env.WG_ITIN_KEYSTORE_BASE64 != ''
        env:
          EXPECTED_MIN_SDK: "24"
          EXPECTED_UPLOAD_CERT_SHA256: 3af98de9a3da39f9ff3a34f1debf00b330ad2edc19e65003ff7012c8ed8f680a
        run: node ../../scripts/verify-native-release.mjs
      - name: Upload public release verification
        if: env.WG_ITIN_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: itineraries-release-verification
          path: native/itineraries/release-verification.json
          if-no-files-found: error

  publish-internal:
    name: Verify and publish Google Play internal release
    if: github.repository_id == '1345300652' && github.ref == 'refs/heads/codex/family-trip-play-store'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: play-family-internal
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: itineraries-release-aab
      - uses: actions/download-artifact@v4
        with:
          name: itineraries-release-verification
      - name: Authenticate to Google Play without a service account key
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1061566886622/locations/global/workloadIdentityPools/play-family-github/providers/github-actions
          service_account: play-family-internal@white-glove-001.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
      - name: Publish only a newer verified bundle to internal testing
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';

          const packageName = 'com.whitegloveitineraries.family';
          const report = JSON.parse(readFileSync('release-verification.json', 'utf8'));
          const bundle = readFileSync('app-release.aab');
          const digest = createHash('sha256').update(bundle).digest('hex');
          assert.equal(report.applicationId, packageName);
          assert.equal(report.aabSha256, digest);
          assert.ok(Number.isSafeInteger(report.versionCode) && report.versionCode > 0);

          const origin = 'https://androidpublisher.googleapis.com';
          const app = '/androidpublisher/v3/applications/' + packageName;
          async function request(path, method = 'GET', body, type = 'application/json') {
            const headers = { Authorization: 'Bearer ' + process.env.PLAY_ACCESS_TOKEN };
            if (body !== undefined) headers['Content-Type'] = type;
            const response = await fetch(origin + path, {
              method, headers, body, signal: AbortSignal.timeout(120_000),
            });
            const result = await response.text();
            if (!response.ok) throw new Error(method + ' ' + path + ' (' + response.status + '): ' + result);
            return result ? JSON.parse(result) : null;
          }

          const { id } = await request(app + '/edits', 'POST', '{}');
          const edit = app + '/edits/' + encodeURIComponent(id);
          let committed = false;
          try {
            const { tracks = [] } = await request(edit + '/tracks');
            const internal = tracks.filter(({ track }) => track === 'internal' || track === 'qa');
            assert.equal(internal.length, 1, 'Expected exactly one internal testing track');
            const { track, releases = [] } = internal[0];
            const codes = releases.flatMap(release => release.versionCodes ?? []).map(Number);
            const current = Math.max(0, ...codes);
            if (report.versionCode <= current) {
              console.log('Verified Google Play access for ' + packageName + ' on ' + track +
                '; latest version code is ' + current + '. No release change needed.');
            } else {
              const uploaded = await request('/upload' + edit + '/bundles?uploadType=media',
                'POST', bundle, 'application/octet-stream');
              assert.equal(uploaded.versionCode, report.versionCode);
              assert.equal(uploaded.sha256?.toLowerCase(), digest);
              const trackPath = edit + '/tracks/' + track;
              const release = { status: 'completed', versionCodes: [String(report.versionCode)] };
              const updated = await request(trackPath, 'PUT', JSON.stringify({ track, releases: [release] }));
              assert.equal(updated.track, track);
              assert.ok(updated.releases.some(item => item.versionCodes?.includes(String(report.versionCode))));
              await request(edit + ':commit', 'POST');
              committed = true;
              console.log('Published version code ' + report.versionCode + ' to internal testing.');
            }
          } finally {
            if (!committed) {
              try { await request(edit, 'DELETE'); } catch (error) { console.warn(error.message); }
            }
          }
          NODE
