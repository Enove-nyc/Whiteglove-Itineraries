name: Build Advisor native app

# Native Capacitor shell for the White Glove Advisor app. Builds a debug APK
# always, and a SIGNED release .aab for the Play Store when the upload-key
# secrets are set (WG_ADVISOR_KEYSTORE_BASE64 / WG_ADVISOR_KEYSTORE_PASSWORD /
# WG_ADVISOR_KEY_ALIAS / WG_ADVISOR_KEY_PASSWORD).

on:
  workflow_dispatch:
  push:
    branches: [claude/native-apps]
    paths:
      - "native/advisor/**"
      - ".github/workflows/native-advisor.yml"
      - "scripts/verify-native-release.mjs"
      - "scripts/native-release-metadata.mjs"
      - "scripts/native-release-metadata.test.mjs"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WG_ADVISOR_KEYSTORE_BASE64: ${{ secrets.WG_ADVISOR_KEYSTORE_BASE64 }}
      WG_ADVISOR_KEYSTORE_PASSWORD: ${{ secrets.WG_ADVISOR_KEYSTORE_PASSWORD }}
      WG_ADVISOR_KEY_ALIAS: ${{ secrets.WG_ADVISOR_KEY_ALIAS }}
      WG_ADVISOR_KEY_PASSWORD: ${{ secrets.WG_ADVISOR_KEY_PASSWORD }}
    defaults:
      run:
        working-directory: native/advisor
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Check release metadata parser
        run: node --test ../../scripts/native-release-metadata.test.mjs
      - name: Install Capacitor
        run: npm ci --no-audit --no-fund
      - name: Sync web config + plugins into the committed Android project
        run: npx cap sync android
      - name: Build debug APK
        working-directory: native/advisor/android
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace
      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: advisor-debug-apk
          path: native/advisor/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Decode the upload keystore
        if: env.WG_ADVISOR_KEYSTORE_BASE64 != ''
        run: echo "$WG_ADVISOR_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/wg-advisor-upload.keystore"
      - name: Build signed release AAB
        if: env.WG_ADVISOR_KEYSTORE_BASE64 != ''
        working-directory: native/advisor/android
        env:
          WG_ADVISOR_KEYSTORE_PATH: ${{ runner.temp }}/wg-advisor-upload.keystore
        run: ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace
      - name: Upload the signed AAB (for the Play Store)
        if: env.WG_ADVISOR_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: advisor-release-aab
          path: native/advisor/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload signed release APK
        if: env.WG_ADVISOR_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: advisor-release-apk
          path: native/advisor/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Verify package, SDK, version and original signing certificate
        if: env.WG_ADVISOR_KEYSTORE_BASE64 != ''
        env:
          EXPECTED_UPLOAD_CERT_SHA256: 543e50416b1a31a8d87b86be03d10c3f0df9bfd4fef1609d10b28fad63417b36
        run: node ../../scripts/verify-native-release.mjs
      - name: Upload public release verification
        if: env.WG_ADVISOR_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: advisor-release-verification
          path: native/advisor/release-verification.json
          if-no-files-found: error
