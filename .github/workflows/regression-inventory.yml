name: Full regression inventory
on:
  push:
    branches: [codex/visitor-regression-inventory]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Run the complete existing test command
        run: npm test > regression.log 2>&1
      - name: Test summary
        if: always()
        run: tail -n 140 regression.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-regression-log
          path: regression.log
          retention-days: 7
