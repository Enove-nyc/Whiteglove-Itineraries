name: Build Admin native app

# Native Capacitor shell for the White Glove Admin console (the dashboard at
# /admin). Private, single-user — meant for Play's internal-testing track, not a
# public listing. Builds a debug APK always, and a SIGNED release .aab when the
# upload-key secrets are set (WG_ADMIN_KEYSTORE_BASE64 / WG_ADMIN_KEYSTORE_PASSWORD
# / WG_ADMIN_KEY_ALIAS / WG_ADMIN_KEY_PASSWORD).

on:
  workflow_dispatch:
  push:
    branches: [claude/native-apps]
    paths:
      - "native/admin/**"
      - ".github/workflows/native-admin.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WG_ADMIN_KEYSTORE_BASE64: ${{ secrets.WG_ADMIN_KEYSTORE_BASE64 }}
      WG_ADMIN_KEYSTORE_PASSWORD: ${{ secrets.WG_ADMIN_KEYSTORE_PASSWORD }}
      WG_ADMIN_KEY_ALIAS: ${{ secrets.WG_ADMIN_KEY_ALIAS }}
      WG_ADMIN_KEY_PASSWORD: ${{ secrets.WG_ADMIN_KEY_PASSWORD }}
    defaults:
      run:
        working-directory: native/admin
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Capacitor
        run: npm ci --no-audit --no-fund
      - name: Sync web config + plugins into the committed Android project
        run: npx cap sync android
      - name: Build debug APK
        working-directory: native/admin/android
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace
      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: admin-debug-apk
          path: native/admin/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Decode the upload keystore
        if: env.WG_ADMIN_KEYSTORE_BASE64 != ''
        run: echo "$WG_ADMIN_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/wg-admin-upload.keystore"
      - name: Build signed release AAB
        if: env.WG_ADMIN_KEYSTORE_BASE64 != ''
        working-directory: native/admin/android
        env:
          WG_ADMIN_KEYSTORE_PATH: ${{ runner.temp }}/wg-admin-upload.keystore
        run: ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace
      - name: Upload the signed AAB (for the Play Store)
        if: env.WG_ADMIN_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: admin-release-aab
          path: native/admin/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload signed release APK
        if: env.WG_ADMIN_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: admin-release-apk
          path: native/admin/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Verify package, SDK, version and original signing certificate
        if: env.WG_ADMIN_KEYSTORE_BASE64 != ''
        env:
          EXPECTED_UPLOAD_CERT_SHA256: 83e1cf83c59dd877f73fb9f284d99b3008c45007b85a5ef262846efb42dff12b
        run: node ../../scripts/verify-native-release.mjs
      - name: Upload public release verification
        if: env.WG_ADMIN_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: admin-release-verification
          path: native/admin/release-verification.json
          if-no-files-found: error
